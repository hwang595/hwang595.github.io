<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Seven-day labels for three mature synthetic requests</title>
  <desc id="desc">All three requests are observed on day 21. A closes on day 3, label 0. B closes on day 9, label 1. C has no recorded closure, label 1. Day 7 is the outcome boundary; day 14 is the minimum maturity.</desc>
  <rect width="320" height="320" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#163f3a" font-size="16">
    <rect x="20" y="39" width="93.333" height="207" fill="#e7f2ec"/>
    <rect x="113.333" y="39" width="93.334" height="207" fill="#f7f0e3"/>
    <g font-size="14"><text x="20" y="20">7-day window</text><text x="160" y="20" text-anchor="middle">Buffer</text><text x="300" y="20" text-anchor="end">Mature</text></g>
    <path d="M113.333 33V256" stroke="#0c7064" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M206.667 33V256" stroke="#9b4f25" stroke-width="2" stroke-dasharray="5 5"/>
    <g stroke="#d6e1dc"><path d="M20 104H300M20 168H300M20 232H300"/></g>
    <g fill="#fff"><rect x="17" y="62" width="286" height="26"/><rect x="17" y="126" width="286" height="26"/><rect x="17" y="190" width="286" height="26"/></g>
    <text x="20" y="81" font-weight="700">A · closes day 3</text><text x="300" y="81" text-anchor="end">Label 0</text>
    <text x="20" y="145" font-weight="700">B · closes day 9</text><text x="300" y="145" text-anchor="end">Label 1</text>
    <text x="20" y="209" font-weight="700">C · no closure</text><text x="300" y="209" text-anchor="end">Label 1</text>
    <path d="M20 104H60" stroke="#0c7064" stroke-width="4"/>
    <circle cx="60" cy="104" r="6" fill="#0c7064"/>
    <path d="M20 168H140" stroke="#9b4f25" stroke-width="4"/>
    <circle cx="140" cy="168" r="6" fill="#9b4f25"/>
    <path d="M20 232H300" stroke="#9b4f25" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="300" cy="232" r="6" fill="#fff" stroke="#9b4f25" stroke-width="3"/>
    <path d="M20 251V261M113.333 251V261M206.667 251V261M300 251V261" stroke="#52666b"/>
    <text x="20" y="281" text-anchor="middle">0</text><text x="113.333" y="281" text-anchor="middle">7</text><text x="206.667" y="281" text-anchor="middle">14</text><text x="300" y="281" text-anchor="middle">21</text>
    <text x="160" y="309" text-anchor="middle" font-size="14" fill="#52666b">Calendar days since creation</text>
  </g>
</svg>
