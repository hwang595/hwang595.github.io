<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562" role="img" aria-labelledby="calibration-title calibration-desc">
<title id="calibration-title">Synthetic calibration plot: probabilities versus group outcomes</title>
<desc id="calibration-desc">Both axes run from zero to one at equal scale. The dashed diagonal is an ideal match between predicted probabilities and observed fractions. The dots summarize invented groups. Mean prediction 0.10 has 12 positive labels out of 100, an observed fraction of 0.12. Mean prediction 0.30 has 25 positive labels out of 100, an observed fraction of 0.25. Mean prediction 0.50 has 40 positive labels out of 100, an observed fraction of 0.40. Mean prediction 0.70 has 50 positive labels out of 100, an observed fraction of 0.50. Mean prediction 0.90 has 70 positive labels out of 100, an observed fraction of 0.70. The highlighted group overestimates risk. These are not measured NYC 311 results.</desc>
